<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史对话</title>
<script src="/static/common.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f4; color: #1c1c1a; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e6e4de; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .nav { margin-left: auto; display: flex; gap: 6px; }
  header .nav a { font-size: 13px; padding: 5px 12px; border: 1px solid #d3d1c7; background: #fff; border-radius: 7px; color: #444; text-decoration: none; }
  header .nav a.on { background: #185FA5; color: #fff; border-color: #185FA5; }
  .filters { padding: 14px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .filters label { font-size: 12px; color: #666; }
  .filters select { font-size: 13px; padding: 5px 10px; border: 1px solid #d3d1c7; border-radius: 7px; }
  .filters .cnt { font-size: 12px; color: #999; margin-left: auto; }
  #list { padding: 0 20px 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  th, td { padding: 11px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0eee8; }
  th { background: #faf9f6; font-weight: 600; color: #555; font-size: 12px; }
  td.ttl a { color: #185FA5; text-decoration: none; font-weight: 500; }
  td.ttl a:hover { text-decoration: underline; }
  tr:hover td { background: #fcfbf8; }
  .emp { color: #0F6E56; }
  .del { color: #c0392b; cursor: pointer; background: none; border: 1px solid #e0b4ad; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
  .pager { padding: 16px 20px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .pager button { font-size: 13px; padding: 5px 12px; border: 1px solid #d3d1c7; background: #fff; border-radius: 7px; cursor: pointer; }
  .pager button:disabled { color: #ccc; cursor: not-allowed; }
  .pager .cur { background: #185FA5; color: #fff; border-color: #185FA5; }
  .empty { padding: 50px; text-align: center; color: #aaa; font-size: 13px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1c1a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1>历史对话</h1>
  <div id="userbar" style="margin-left:auto;"></div>
  <div class="nav">
    <a href="/">🏠 主页</a>
    <a href="/chat.html">💬 对话</a>
    <a href="/admin.html">👥 员工管理</a>
    <a href="/resources.html">📚 资源中心</a>
  </div>
</header>

<div class="filters">
  <label>员工</label>
  <select id="empSel" onchange="reload()"><option value="">全部员工</option></select>
  <span class="cnt" id="cnt"></span>
</div>

<div id="list"></div>
<div class="pager" id="pager"></div>
<div id="toast"></div>

<script>
let PAGE = 1, PAGESIZE = 10, EMP_NAMES = {};
function uid(){ return (Auth.user() || {}).id || "default"; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return (s||"").replace("T"," ").slice(5,16); }

async function loadEmps(){
  const emps = await fetch("/api/employees").then(r=>r.json());
  EMP_NAMES = {}; emps.forEach(e=>EMP_NAMES[e.id]=e.name);
  document.getElementById("empSel").innerHTML = '<option value="">全部员工</option>' +
    emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
}

async function reload(){
  const emp = document.getElementById("empSel").value;
  const url = `/api/conversations?page=${PAGE}&page_size=${PAGESIZE}` + (emp?`&employee_id=${encodeURIComponent(emp)}`:"");
  const d = await fetch(url).then(r=>r.json());
  render(d);
}

function render(d){
  const items = d.items || [];
  document.getElementById("cnt").textContent = `共 ${d.total} 条 · 第 ${d.page}/${d.pages||1} 页`;
  const box = document.getElementById("list");
  if(!items.length){ box.innerHTML = '<div class="empty">该用户暂无历史对话</div>'; renderPager(d); return; }
  box.innerHTML = `<table><thead><tr><th>标题</th><th>员工</th><th>消息数</th><th>更新时间</th><th></th></tr></thead><tbody>` +
    items.map(c=>`<tr>
      <td class="ttl"><a href="/chat.html?conv=${esc(c.conv_id)}">${esc((c.title&&c.title.trim())?c.title:(c.preview||"新对话"))}</a></td>
      <td class="emp">${esc(EMP_NAMES[c.employee_id]||c.employee_id)}</td>
      <td>${c.message_count||0}</td>
      <td>${fmt(c.updated_at)}</td>
      <td style="white-space:nowrap;"><a href="/trace.html?conv=${esc(c.conv_id)}" style="font-size:12px;color:#185FA5;text-decoration:none;margin-right:10px;">执行过程</a><button class="del" onclick="del('${esc(c.conv_id)}','${esc((c.title||'').replace(/'/g,""))}')">删除</button></td>
    </tr>`).join("") + `</tbody></table>`;
  renderPager(d);
}

function renderPager(d){
  const p = document.getElementById("pager");
  const pages = d.pages || 1;
  let html = `<button ${d.page<=1?'disabled':''} onclick="go(${d.page-1})">‹ 上一页</button>`;
  // 简单页码：显示当前前后2页
  const from = Math.max(1, d.page-2), to = Math.min(pages, d.page+2);
  for(let i=from;i<=to;i++) html += `<button class="${i===d.page?'cur':''}" onclick="go(${i})">${i}</button>`;
  html += `<button ${d.page>=pages?'disabled':''} onclick="go(${d.page+1})">下一页 ›</button>`;
  p.innerHTML = html;
}
function go(n){ PAGE=n; reload(); }

async function del(cid, title){
  if(!confirm(`删除会话「${title||cid}」？该会话的全部消息将被清除，不可恢复。`)) return;
  const j = await fetch(`/api/conversations/${encodeURIComponent(cid)}`, {method:"DELETE"}).then(r=>r.json());
  if(j.error){ toast(j.error); return; }
  toast("已删除"); reload();
}

(async function init(){
  if (!requireAuth()) return;
  mountUserBar("userbar");
  window.fetch = authFetch;
  await loadEmps();
  await reload();
})();
</script>
</body>
</html>
