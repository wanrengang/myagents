<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · 数字员工平台</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: linear-gradient(180deg,#f7f6f3,#eef1f4); color:#1c1c1a; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; border:1px solid #e6e4de; border-radius:16px; padding:36px 34px; width:380px; box-shadow:0 12px 30px rgba(0,0,0,.06); }
  .logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,#B4552D,#e0854f); display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; margin:0 auto 16px; }
  h1 { font-size:18px; font-weight:600; text-align:center; margin-bottom:6px; }
  .sub { font-size:12px; color:#999; text-align:center; margin-bottom:24px; line-height:1.7; }
  .f { margin-bottom:14px; }
  .f label { display:block; font-size:12px; color:#666; margin-bottom:5px; }
  .f input { width:100%; font-size:14px; padding:9px 12px; border:1px solid #d3d1c7; border-radius:8px; }
  .f input:focus { outline:none; border-color:#B4552D; }
  button { width:100%; font-size:14px; padding:10px; border:none; border-radius:8px; background:#B4552D; color:#fff; cursor:pointer; margin-top:4px; }
  button:hover { background:#9a4826; }
  .err { color:#c0392b; font-size:12px; text-align:center; min-height:16px; margin-bottom:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔒</div>
  <h1>修改密码</h1>
  <div class="sub">当前账号仍在使用默认密码，<br>出于安全要求，请设置新密码后继续使用。</div>
  <div class="err" id="err"></div>
  <div class="f"><label>原密码</label><input id="op" type="password" autocomplete="current-password"></div>
  <div class="f"><label>新密码（至少 8 位）</label><input id="np" type="password" autocomplete="new-password"></div>
  <div class="f"><label>确认新密码</label><input id="np2" type="password" autocomplete="new-password"></div>
  <button onclick="doChange()">确认修改</button>
</div>
<script src="/static/common.js"></script>
<script>
const next = new URLSearchParams(location.search).get("next") || "/chat.html";
if (!requireAuth()) throw new Error("未登录");
document.getElementById("np2").addEventListener("keydown", e => { if (e.key === "Enter") doChange(); });
async function doChange() {
  const op = document.getElementById("op").value;
  const np = document.getElementById("np").value;
  const np2 = document.getElementById("np2").value;
  const err = document.getElementById("err");
  if (!op || !np) { err.textContent = "请填写完整"; return; }
  if (np.length < 8) { err.textContent = "新密码至少 8 位"; return; }
  if (np !== np2) { err.textContent = "两次输入的新密码不一致"; return; }
  try {
    const r = await authFetch("/api/auth/change-password", { method: "POST", body: { old_password: op, new_password: np } });
    const d = await r.json();
    if (!r.ok || d.error) { err.textContent = d.detail || d.error || ("修改失败(" + r.status + ")"); return; }
    alert("密码修改成功，请重新登录");
    Auth.clear();
    location.href = "/login.html?next=" + encodeURIComponent(next);
  } catch (e) { err.textContent = "修改失败：" + e.message; }
}
</script>
</body>
</html>
