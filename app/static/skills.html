<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能管理</title>
<script src="/static/common.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f4; color: #1c1c1a; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e6e4de; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: #999; }
  header .nav { margin-left: auto; display: flex; gap: 8px; }
  header .nav a { font-size: 13px; padding: 5px 14px; border: 1px solid #d3d1c7; background: #fff; border-radius: 7px; color: #185FA5; text-decoration: none; }
  .toolbar { padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .toolbar button { font-size: 13px; padding: 7px 16px; border: 1px solid #185FA5; background: #185FA5; color: #fff; border-radius: 8px; cursor: pointer; }
  .toolbar .cnt { font-size: 12px; color: #888; }
  #list { padding: 0 24px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e6e4de; border-radius: 12px; padding: 16px; }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card .nm { font-size: 15px; font-weight: 600; }
  .card .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .tag.builtin { background: #eef2ee; color: #0F6E56; }
  .tag.custom { background: #fdf3e7; color: #b06a1a; }
  .card .desc { font-size: 12.5px; color: #666; line-height: 1.6; min-height: 20px; }
  .card .meta { font-size: 11px; color: #aaa; margin-top: 8px; word-break: break-all; }
  .card .acts { margin-top: 12px; display: flex; gap: 8px; }
  .card .acts button { font-size: 12px; padding: 4px 12px; border: 1px solid #d3d1c7; background: #fff; border-radius: 6px; cursor: pointer; }
  .card .acts .del { color: #c0392b; border-color: #e0b4ad; }
  .card .acts .del:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }
  .empty { padding: 40px; text-align: center; color: #aaa; font-size: 13px; }
  /* 抽屉：查看 SKILL.md 内容 */
  #drawer { position: fixed; top: 0; right: 0; width: 560px; max-width: 90vw; height: 100vh; background: #fff; border-left: 1px solid #e6e4de; box-shadow: -4px 0 18px rgba(0,0,0,.06); transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; z-index: 30; }
  #drawer.show { transform: translateX(0); }
  #drawer .dh { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  #drawer .dh h3 { font-size: 14px; flex: 1; }
  #drawer .dh button { font-size: 12px; padding: 4px 12px; border: 1px solid #d3d1c7; background: #fff; border-radius: 6px; cursor: pointer; }
  #drawer .dp { font-size: 11px; color: #aaa; padding: 0 18px 8px; word-break: break-all; }
  #drawer pre { flex: 1; overflow: auto; padding: 16px 18px; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #2a2a26; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1c1a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40; }
  #toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1>技能管理</h1>
  <span class="sub">上传 / 查看 / 删除技能，员工配置时只需勾选</span>
  <div id="userbar" style="margin-left:auto;"></div>
  <div class="nav">
    <a href="/">🏠 主页</a>
    <a href="/chat.html">💬 对话</a>
    <a href="/admin.html">👥 员工管理</a>
    <a href="/resources.html">📚 资源中心</a>
  </div>
</header>

<div class="toolbar">
  <button onclick="document.getElementById('uploadInput').click()">📥 上传技能(zip)</button>
  <input id="uploadInput" type="file" accept=".zip" style="display:none;">
  <span class="cnt" id="cnt"></span>
</div>

<div id="list"></div>

<div id="drawer">
  <div class="dh"><h3 id="dvTitle">SKILL.md</h3><button onclick="closeDrawer()">关闭</button></div>
  <div class="dp" id="dvPath"></div>
  <pre id="dvContent"></pre>
</div>
<div id="toast"></div>

<script>
let SKILLS = [];
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function reload(){
  const d = await fetch("/api/admin/catalog").then(r=>r.json());
  SKILLS = d.skills || [];
  render();
}
function render(){
  const box = document.getElementById("list");
  document.getElementById("cnt").textContent = `共 ${SKILLS.length} 个技能`;
  if(!SKILLS.length){ box.innerHTML = '<div class="empty">暂无技能，点上方「上传技能」添加</div>'; return; }
  box.innerHTML = "";
  SKILLS.forEach(s=>{
    const card = document.createElement("div");
    card.className = "card";
    const tag = s.is_custom ? '<span class="tag custom">自定义</span>' : '<span class="tag builtin">内置</span>';
    card.innerHTML = `
      <div class="top"><span class="nm">${esc(s.name)}</span>${tag}</div>
      <div class="desc">${esc(s.description||"(无描述)")}</div>
      <div class="meta">${esc(s.dir)}</div>
      <div class="acts">
        <button onclick="viewContent('${esc(s.id)}','${esc(s.name)}')">查看 SKILL.md</button>
        <button class="del" ${s.is_custom?"":"disabled"} onclick="delSkill('${esc(s.id)}','${esc(s.name)}')">${s.is_custom?"删除":""}</button>
      </div>`;
    box.appendChild(card);
  });
}

async function viewContent(id, name){
  try{
    const j = await fetch(`/api/admin/skills/${encodeURIComponent(id)}/content`).then(r=>r.json());
    if(j.error){ toast(j.error); return; }
    document.getElementById("dvTitle").textContent = name + " · SKILL.md";
    document.getElementById("dvPath").textContent = j.path;
    document.getElementById("dvContent").textContent = j.content;
    document.getElementById("drawer").classList.add("show");
  }catch(e){ toast("读取失败："+e.message); }
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("show"); }

async function uploadSkill(file){
  const fd = new FormData(); fd.append("file", file);
  toast("上传中…");
  try{
    const j = await fetch("/api/admin/skills/upload",{method:"POST",body:fd}).then(r=>r.json());
    if(j.error){ toast("上传失败："+j.error); return; }
    toast("已上传："+j.name);
    await reload();
  }catch(e){ toast("上传出错："+e.message); }
}
async function delSkill(id, name){
  if(!confirm(`确认删除自定义技能「${name}」？会从所有员工移除该技能，不可恢复。`)) return;
  try{
    const j = await fetch(`/api/admin/skills/${encodeURIComponent(id)}`,{method:"DELETE"}).then(r=>r.json());
    if(j.error){ toast(j.error); return; }
    toast("已删除");
    await reload();
  }catch(e){ toast("删除出错："+e.message); }
}

document.getElementById("uploadInput").addEventListener("change", e=>{
  if(e.target.files && e.target.files[0]) uploadSkill(e.target.files[0]);
  e.target.value = "";
});
if(!requireAdmin())return;
mountUserBar("userbar");
window.fetch=authFetch;
reload();
</script>
</body>
</html>
