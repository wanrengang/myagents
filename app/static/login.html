<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 数字员工平台</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: linear-gradient(180deg,#f7f6f3,#eef1f4); color:#1c1c1a; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; border:1px solid #e6e4de; border-radius:16px; padding:36px 34px; width:360px; box-shadow:0 12px 30px rgba(0,0,0,.06); }
  .logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,#185FA5,#4a90d9); display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:700; margin:0 auto 16px; }
  h1 { font-size:18px; font-weight:600; text-align:center; margin-bottom:6px; }
  .sub { font-size:12px; color:#999; text-align:center; margin-bottom:24px; }
  .f { margin-bottom:14px; }
  .f label { display:block; font-size:12px; color:#666; margin-bottom:5px; }
  .f input { width:100%; font-size:14px; padding:9px 12px; border:1px solid #d3d1c7; border-radius:8px; }
  .f input:focus { outline:none; border-color:#185FA5; }
  button { width:100%; font-size:14px; padding:10px; border:none; border-radius:8px; background:#185FA5; color:#fff; cursor:pointer; margin-top:4px; }
  button:hover { background:#144e8a; }
  .err { color:#c0392b; font-size:12px; text-align:center; min-height:16px; margin-bottom:8px; }
  .tip { font-size:11px; color:#aaa; text-align:center; margin-top:16px; line-height:1.7; }
  a.back { display:block; text-align:center; font-size:12px; color:#185FA5; text-decoration:none; margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">数</div>
  <h1>数字员工平台</h1>
  <div class="sub">请登录后使用</div>
  <div class="err" id="err"></div>
  <div class="f"><label>用户名</label><input id="u" autocomplete="username"></div>
  <div class="f"><label>密码</label><input id="p" type="password" autocomplete="current-password"></div>
  <button onclick="doLogin()">登 录</button>
  <div class="tip">默认管理员 admin / admin123（请尽快改密）</div>
  <a class="back" href="/">← 返回首页</a>
</div>
<script src="/static/common.js"></script>
<script>
const next = new URLSearchParams(location.search).get("next") || "/chat.html";
// 已登录直接跳
if (Auth.loggedIn()) location.href = next;
document.getElementById("p").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value;
  if (!u || !p) { document.getElementById("err").textContent = "请输入用户名和密码"; return; }
  try {
    const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
    const d = await r.json();
    if (!r.ok || d.error) { document.getElementById("err").textContent = d.detail || d.error || ("登录失败(" + r.status + ")"); return; }
    Auth.save(d.token, d.user);
    if (d.must_change_password) { location.href = "/change-password.html?next=" + encodeURIComponent(next); return; }
    location.href = next;
  } catch (e) { document.getElementById("err").textContent = "登录失败：" + e.message; }
}
</script>
</body>
</html>
