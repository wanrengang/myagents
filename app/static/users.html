<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理</title>
<script src="/static/common.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f4; color: #1c1c1a; min-height: 100vh; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e6e4de; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .nav { margin-left: auto; display: flex; gap: 6px; }
  header .nav a { font-size: 13px; padding: 5px 12px; border: 1px solid #d3d1c7; background: #fff; border-radius: 7px; color: #444; text-decoration: none; }
  .wrap { max-width: 880px; margin: 24px auto; padding: 0 20px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .toolbar h2 { font-size: 15px; flex: 1; }
  .toolbar button { font-size: 13px; padding: 6px 14px; border: 1px solid #185FA5; background: #185FA5; color: #fff; border-radius: 7px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  th, td { padding: 11px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0eee8; }
  th { background: #faf9f6; font-weight: 600; color: #555; font-size: 12px; }
  tr:hover td { background: #fcfbf8; }
  .role { font-size: 11px; padding: 2px 8px; border-radius: 9px; }
  .role.admin { background: #fdf3e7; color: #b06a1a; }
  .role.user { background: #eef2ee; color: #0F6E56; }
  .st.dis { color: #c0392b; }
  .act button { font-size: 12px; padding: 3px 10px; border: 1px solid #d3d1c7; background: #fff; border-radius: 6px; cursor: pointer; margin-right: 4px; }
  .act button.danger { color: #c0392b; border-color: #e0b4ad; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 40; }
  #modal.show { display: flex; }
  #modal .box { background: #fff; border-radius: 12px; padding: 22px 24px; width: 380px; }
  #modal h3 { font-size: 15px; margin-bottom: 14px; }
  #modal .f { margin-bottom: 12px; }
  #modal .f label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  #modal .f input, #modal .f select { width: 100%; font-size: 13px; padding: 7px 10px; border: 1px solid #d3d1c7; border-radius: 7px; }
  #modal .acts { display: flex; gap: 8px; margin-top: 6px; }
  #modal .acts button { font-size: 13px; padding: 7px 16px; border-radius: 7px; cursor: pointer; border: 1px solid #d3d1c7; background: #fff; }
  #modal .acts .save { background: #185FA5; color: #fff; border-color: #185FA5; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1c1a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1>用户管理</h1>
  <div id="userbar" style="margin-left:auto;"></div>
  <div class="nav">
    <a href="/">🏠 主页</a>
    <a href="/admin.html">👥 员工管理</a>
    <a href="/resources.html">📚 资源中心</a>
  </div>
</header>
<div class="wrap">
  <div class="toolbar"><h2>用户列表</h2><button onclick="openCreate()">+ 新建用户</button></div>
  <table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
  <tbody id="rows"></tbody></table>
</div>
<div id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div>
  <div class="acts"><button class="save" id="mSave">保存</button><button id="mCancel">取消</button></div></div></div>
<div id="toast"></div>
<script>
let USERS = [], onSave = null;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return (s||"").replace(" "," ").slice(5,16); }
async function reload(){ USERS = await authFetch("/api/admin/users").then(r=>r.json()); render(); }
function render(){
  const me = (Auth.user()||{}).id;
  document.getElementById("rows").innerHTML = USERS.map(u=>{
    const isSelf = u.id === me;
    const delBtn = isSelf
      ? `<button class="danger" disabled title="不能删除当前登录的自己" style="opacity:.4;cursor:not-allowed;">删除</button>`
      : `<button class="danger" onclick="delUser('${esc(u.id)}','${esc(u.username)}')">删除</button>`;
    return `<tr>
    <td>${esc(u.username)}${u.id==='u_admin'?' <span style="color:#aaa;font-size:11px;">(初始)</span>':''}</td>
    <td><span class="role ${u.role}">${u.role}</span></td>
    <td class="st ${u.status==='disabled'?'dis':''}">${u.status}</td>
    <td>${fmt(u.created_at)}</td>
    <td class="act">
      <button onclick="openAssign('${esc(u.id)}','${esc(u.username)}')">分配</button>
      <button onclick="openReset('${esc(u.id)}','${esc(u.username)}')">改密</button>
      <button onclick="toggleStatus('${esc(u.id)}','${u.status}','${esc(u.username)}')">${u.status==='active'?'禁用':'启用'}</button>
      ${delBtn}
    </td></tr>`;
  }).join("");
}
function openCreate(){
  openModal("新建用户", `
    <div class="f"><label>用户名</label><input id="f_username"></div>
    <div class="f"><label>密码</label><input id="f_password" type="password"></div>
    <div class="f"><label>角色</label><select id="f_role"><option value="user">user</option><option value="admin">admin</option></select></div>`,
  async()=>{ const b={username:document.getElementById("f_username").value, password:document.getElementById("f_password").value, role:document.getElementById("f_role").value};
    const j=await authFetch("/api/admin/users",{method:"POST",body:b}).then(r=>r.json());
    if(j.error){toast(j.error);return false;} toast("已创建"); return true; });
}
function openReset(uid, name){
  openModal("重置密码 · "+name, `<div class="f"><label>新密码</label><input id="f_pw" type="password"></div>`,
  async()=>{ const j=await authFetch(`/api/admin/users/${uid}/password`,{method:"PUT",body:{password:document.getElementById("f_pw").value}}).then(r=>r.json());
    if(j.error){toast(j.error);return false;} toast("已改密"); return true; });
}
async function toggleStatus(uid, status, name){
  const ns = status==='active'?'disabled':'active';
  if(ns==='disabled' && !confirm(`禁用用户「${name}」？`)) return;
  const j=await authFetch(`/api/admin/users/${uid}`,{method:"PUT",body:{status:ns}}).then(r=>r.json());
  if(j.error){toast(j.error);return;} toast(ns==='active'?'已启用':'已禁用'); reload();
}
async function delUser(uid, name){
  if(!confirm(`删除用户「${name}」？`)) return;
  const j=await authFetch(`/api/admin/users/${uid}`,{method:"DELETE"}).then(r=>r.json());
  if(j.error){toast(j.error);return;} toast("已删除"); reload();
}
async function openAssign(uid, name){
  const data = await authFetch(`/api/admin/users/${uid}/employees`).then(r=>r.json());
  if(data.error){ toast(data.error); return; }
  const rows = data.employees.map(e=>{
    const ov = JSON.stringify(e.overrides||{});
    return `<div class="asg-row" style="border:1px solid #eee;border-radius:8px;padding:8px 10px;margin-bottom:8px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
        <input type="checkbox" class="asg-chk" data-emp="${esc(e.employee_id)}" ${e.granted?'checked':''}>
        <b>${esc(e.name)}</b> <span style="color:#999;">${esc(e.employee_id)}</span>
      </label>
      <div class="ov-edit" style="margin-top:6px;${e.granted?'':'display:none;'}">
        <label style="font-size:11px;color:#888;">预置覆盖 JSON（可选）：{"add":{"skills":[]},"remove":{"skills":[]}}</label>
        <textarea class="ov-ta" data-emp="${esc(e.employee_id)}" rows="2" style="width:100%;font-size:12px;font-family:monospace;border:1px solid #d3d1c7;border-radius:6px;padding:6px;">${esc(ov==='{}'?'':ov)}</textarea>
      </div>
    </div>`;
  }).join("");
  openModal("分配数字员工 · "+name, `<div id="asgList">${rows}</div>
    <p style="font-size:11px;color:#999;margin-top:6px;">勾选=分配，取消勾选=取消分配；覆盖仅作用该用户，不改全局模板。</p>`,
  async()=>{
    const checks=[...document.querySelectorAll('.asg-chk')];
    for(const c of checks){
      const emp=c.dataset.emp, granted=c.checked;
      const cur=data.employees.find(x=>x.employee_id===emp).granted;
      const ta=document.querySelector('.ov-ta[data-emp="'+emp+'"]');
      let ov={};
      if(ta && ta.value.trim()){ try{ ov=JSON.parse(ta.value); }catch(e){ toast('员工 '+emp+' 覆盖 JSON 非法'); return false; } }
      try{
        if(granted && !cur){
          const j=await authFetch(`/api/admin/users/${uid}/employees`,{method:"POST",body:{employee_id:emp,overrides:ov}}).then(r=>r.json());
          if(j.error){ toast(j.error); return false; }
        } else if(!granted && cur){
          const j=await authFetch(`/api/admin/users/${uid}/employees/${emp}`,{method:"DELETE"}).then(r=>r.json());
          if(j.error){ toast(j.error); return false; }
        } else if(granted && cur){
          const j=await authFetch(`/api/admin/users/${uid}/employees/${emp}`,{method:"PUT",body:{overrides:ov}}).then(r=>r.json());
          if(j.error){ toast(j.error); return false; }
        }
      }catch(e){ toast(e.message); return false; }
    }
    toast("已保存分配"); return true;
  });
  document.querySelectorAll('.asg-chk').forEach(c=>c.addEventListener('change',()=>{
    const ed=c.closest('.asg-row').querySelector('.ov-edit');
    if(ed) ed.style.display=c.checked?'':'none';
  }));
}
function openModal(title, html, saveFn){ document.getElementById("mTitle").textContent=title; document.getElementById("mBody").innerHTML=html; onSave=saveFn; document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); onSave=null; }
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("mSave").onclick=async()=>{ if(onSave){ const ok=await onSave(); if(ok){closeModal();reload();} } };
(async function init(){
  if(!requireAdmin()) return;
  mountUserBar("userbar"); await reload();
})();
</script>
</body>
</html>
